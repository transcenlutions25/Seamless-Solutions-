openapi: 3.0.3
info:
  title: Seamless Solutions API
  description: Production-ready API for service-based business platform
  version: 1.0.0
  contact:
    email: api@seamlesssolutions.com

servers:
  - url: http://localhost:4000/api
    description: Development server
  - url: https://api.seamlesssolutions.com
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        traceId:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [OWNER, STAFF, VENDOR, CLIENT]

    Lead:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [NEW, CONTACTED, QUALIFIED, QUOTED, WON, LOST]
        contact:
          $ref: '#/components/schemas/Contact'
        priority:
          type: integer
        estimatedValue:
          type: number
        description:
          type: string

    Contact:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        type:
          type: string
          enum: [LEAD, CLIENT, VENDOR, PARTNER]

    Bid:
      type: object
      properties:
        id:
          type: string
        sqft:
          type: integer
        rooms:
          type: integer
        tier:
          type: string
          enum: [BASIC, STANDARD, PREMIUM, LUXURY]
        totalPrice:
          type: number

    Quote:
      type: object
      properties:
        id:
          type: string
        quoteNumber:
          type: string
        title:
          type: string
        total:
          type: number
        status:
          type: string
          enum: [DRAFT, SENT, VIEWED, ACCEPTED, REJECTED, EXPIRED]

    Job:
      type: object
      properties:
        id:
          type: string
        jobNumber:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, PAUSED, COMPLETED, CANCELLED]
        scheduledStart:
          type: string
          format: date-time

    Invoice:
      type: object
      properties:
        id:
          type: string
        invoiceNumber:
          type: string
        total:
          type: number
        status:
          type: string
          enum: [DRAFT, SENT, VIEWED, PAID, OVERDUE, CANCELLED]

paths:
  /health:
    get:
      summary: Health check
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string

  /auth/register:
    post:
      summary: Register new organization and owner
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
                - orgName
                - orgSlug
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
                orgName:
                  type: string
                orgSlug:
                  type: string
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /auth/login:
    post:
      summary: Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /auth/me:
    get:
      summary: Get current user
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'

  /leads:
    get:
      summary: Get all leads with Kanban view
      tags:
        - Leads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Leads retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lead'
                  kanban:
                    type: object

  /leads/public:
    post:
      summary: Public lead submission form
      tags:
        - Leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Lead created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  leadId:
                    type: string

  /bids:
    post:
      summary: Calculate AI bid
      tags:
        - Bids
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sqft
                - rooms
              properties:
                sqft:
                  type: integer
                rooms:
                  type: integer
                tier:
                  type: string
                  enum: [BASIC, STANDARD, PREMIUM, LUXURY]
                deepClean:
                  type: boolean
                pestControl:
                  type: boolean
      responses:
        '200':
          description: Bid calculated
          content:
            application/json:
              schema:
                type: object
                properties:
                  bid:
                    $ref: '#/components/schemas/Bid'

  /quotes:
    get:
      summary: Get all quotes
      tags:
        - Quotes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quotes retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  quotes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quote'

  /jobs:
    get:
      summary: Get all jobs
      tags:
        - Jobs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        '200':
          description: Jobs retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'

  /invoices:
    get:
      summary: Get all invoices
      tags:
        - Invoices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invoices retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'

  /analytics/dashboard:
    get:
      summary: Get dashboard KPIs
      tags:
        - Analytics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipeline:
                    type: object
                  conversionRate:
                    type: number
                  revenue:
                    type: object
                  jobs:
                    type: object
                  quotes:
                    type: object

tags:
  - name: System
    description: System endpoints
  - name: Auth
    description: Authentication and user management
  - name: Leads
    description: Lead management and CRM
  - name: Bids
    description: AI bid calculator
  - name: Quotes
    description: Quote management
  - name: Jobs
    description: Job scheduling and tracking
  - name: Invoices
    description: Invoice and payment management
  - name: Analytics
    description: Business analytics and reporting
